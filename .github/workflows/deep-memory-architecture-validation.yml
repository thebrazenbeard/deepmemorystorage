name: Deep Memory architecture validation

on:
  pull_request:
    paths:
      - "ledger/**"
      - "updates/**"
      - "schema/**"
      - "architecture/**"
      - "tools/**"
      - ".github/workflows/deep-memory-architecture-validation.yml"
  push:
    branches: [main]
    paths:
      - "ledger/**"
      - "updates/**"
      - "schema/**"
      - "architecture/**"
      - "tools/**"
      - ".github/workflows/deep-memory-architecture-validation.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Compile tools
        run: python -m py_compile tools/deep_memory_catalog.py tools/query_deep_memory.py tools/validate_architecture_binding.py
      - name: Validate architecture binding
        run: python tools/validate_architecture_binding.py
      - name: Validate complete ledger union
        id: union
        shell: bash
        run: |
          set +e
          python tools/deep_memory_catalog.py --validate --json > validation.json 2> validation.stderr
          code=$?
          cat validation.json || true
          cat validation.stderr >&2 || true
          echo "$code" > validation.exit_code
          exit "$code"
      - name: Preserve validation diagnostics
        if: always()
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
        with:
          name: deep-memory-validation-diagnostics
          path: |
            validation.json
            validation.stderr
            validation.exit_code
          if-no-files-found: warn
      - name: Build disposable consolidated retrieval artifacts
        run: |
          rm -rf /tmp/deep-memory-catalog
          python tools/deep_memory_catalog.py --write-output /tmp/deep-memory-catalog --json
          test -s /tmp/deep-memory-catalog/retrieval_catalog.jsonl
          test -s /tmp/deep-memory-catalog/corpus_manifest.json
          python - <<'PY'
          import json
          manifest = json.load(open('/tmp/deep-memory-catalog/corpus_manifest.json', encoding='utf-8'))
          assert len(manifest['union_subject_digest_sha256']) == 64
          assert manifest['latest_receipt_chain_status'] == 'CHAIN_RESOLVES'
          assert manifest['latest_receipt_union_match_status'] == 'ROW_COUNT_MATCH'
          assert manifest['validation']['latest_receipt_matches_union'] is False
          assert manifest['validation']['latest_receipt_row_count_matches_union'] is True
          assert manifest['validation']['lineage_claim_ceiling'] == 'ROW_COUNT_ONLY_OR_WEAKER'
          PY
      - name: Prove catalog carries effective overlay provenance
        run: |
          python - <<'PY'
          import json
          rows = [json.loads(line) for line in open('/tmp/deep-memory-catalog/retrieval_catalog.jsonl', encoding='utf-8') if line.strip()]
          row = next(item for item in rows if item['memory_id'] == 'WORK-BUS-RADAR-CENTRAL-RECONCILIATION-0906')
          assert 'stored_source_ids' in row
          assert 'SRC-BUS-RADAR-NODE-ROUTING-HARDENING-0906-P36' in row['source_ids'], row
          assert 'SRC-BUS-RADAR-NODE-ROUTING-HARDENING-0906-P36' not in row['stored_source_ids'], row
          PY
      - name: Prove query privacy fails closed
        shell: bash
        run: |
          set +e
          python tools/query_deep_memory.py "Vera" --limit 1 --json >/tmp/privacy-out 2>/tmp/privacy-err
          code=$?
          set -e
          test "$code" -ne 0
          grep -q "authorized-privacy\|audit-all-privacy" /tmp/privacy-err
      - name: Prove restricted classification overlays do not leak conclusions
        run: |
          python - <<'PY'
          import sys
          sys.path.insert(0, 'tools')
          from query_deep_memory import _visible_effective_canonicity, _visible_overlay_rows

          base = {'historical_canonicity': 'UNRESOLVED_HISTORY', 'privacy_scope': 'BASE'}
          restricted = [{
              'correction_id': 'TEST',
              'corrected_historical_canonicity': 'CANONICAL_HISTORY',
              'privacy_scope': 'RESTRICTED',
          }]
          hidden = _visible_overlay_rows(
              restricted,
              target_privacy_scope='BASE',
              audit_all_privacy=False,
              authorized_privacy={'BASE'},
          )
          assert hidden == []
          assert _visible_effective_canonicity(base, [], hidden) == 'UNRESOLVED_HISTORY'

          visible = _visible_overlay_rows(
              restricted,
              target_privacy_scope='BASE',
              audit_all_privacy=False,
              authorized_privacy={'BASE', 'RESTRICTED'},
          )
          assert len(visible) == 1
          assert _visible_effective_canonicity(base, [], visible) == 'CANONICAL_HISTORY'
          PY
      - name: Prove Pass-010 historical-canon overlay is effective
        run: |
          python tools/query_deep_memory.py "AUTO-EARLY-001" --audit-all-privacy --historical-canonicity CANONICAL_HISTORY --limit 5 --json > /tmp/legacy-overlay.json
          python - <<'PY'
          import json
          data = json.load(open('/tmp/legacy-overlay.json', encoding='utf-8'))
          row = next(item for item in data['results'] if item['memory_id'] == 'AUTO-EARLY-001')
          assert row['historical_canonicity'] == 'CANONICAL_HISTORY'
          assert row['historical_canon_overlays'], row
          assert any(item.get('overlay_id') == 'historical_canon_pass10' for item in row['historical_canon_overlays'])
          PY
      - name: Prove amendment and correction text are searchable
        run: |
          python tools/query_deep_memory.py "immutable node ownership" --audit-all-privacy --limit 20 --json > /tmp/amendment-query.json
          python tools/query_deep_memory.py "source-scope correction" --audit-all-privacy --limit 20 --json > /tmp/correction-query.json
          python - <<'PY'
          import json
          a = json.load(open('/tmp/amendment-query.json', encoding='utf-8'))
          c = json.load(open('/tmp/correction-query.json', encoding='utf-8'))
          assert any(item['memory_id'] == 'WORK-BUS-RADAR-CENTRAL-RECONCILIATION-0906' for item in a['results']), a
          assert any(item['memory_id'] == 'AUTO-ORIENTATION-020' for item in c['results']), c
          PY
      - name: Smoke-test explicit archive-audit query
        run: |
          python tools/query_deep_memory.py "Vera" --audit-all-privacy --limit 3 --json > /tmp/deep-memory-query.json
          python - <<'PY'
          import json
          data = json.load(open('/tmp/deep-memory-query.json', encoding='utf-8'))
          assert data.get('schema') == 'VERA_DEEP_MEMORY_EVIDENCE_RESULT_V1'
          assert data.get('privacy_mode') == 'EXPLICIT_ARCHIVE_AUDIT_ALL'
          assert data.get('retrieved_at')
          assert isinstance(data.get('results'), list)
          assert data['results'], 'expected at least one bounded historical result'
          required = {
              'memory_id', 'memory_class', 'stored_historical_canonicity', 'historical_canonicity',
              'event_time', 'recorded_at', 'recorded_at_status', 'chronology_semantics',
              'provenance_ceiling', 'privacy_scope', 'currentness_rule',
              'governed_memory_admission', 'source_ids', 'ledger_path',
              'overlay_privacy_semantics', 'result_semantics',
          }
          assert 'authorized_privacy_scopes' in data
          for row in data['results']:
              assert required <= set(row), sorted(required - set(row))
              assert row.get('result_semantics') == 'HISTORICAL_EVIDENCE_ONLY_NOT_CURRENT_MEMORY_OR_AUTHORITY'
              assert row.get('overlay_privacy_semantics') == 'OVERLAY_INHERITS_TARGET_PRIVACY_UNLESS_EXPLICIT_SCOPE_REQUIRES_SEPARATE_AUTHORIZATION'
              assert row.get('ledger_path')
          PY
